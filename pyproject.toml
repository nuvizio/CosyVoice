[project]
name = "cosyvoice"
version = "0.1.0"
description = "CosyVoice: A multilingual, ultra-low latency, high-quality text-to-speech model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "conformer>=0.3.2,<0.4.0",
    "deepspeed>=0.15.1,<0.16.0; sys_platform == 'linux'",
    "diffusers>=0.29.0,<0.30.0",
    "fastapi>=0.115.0,<0.116.0",
    "fastapi-cli>=0.0.4,<0.1.0",
    "gdown>=5.1.0,<6.0.0",
    "gradio>=5.4.0,<6.0.0",
    "grpcio>=1.57.0,<2.0.0",
    "grpcio-tools>=1.57.0,<2.0.0",
    "hydra-core>=1.3.0,<2.0.0",
    "HyperPyYAML>=1.2.0,<2.0.0",
    "inflect>=7.3.0,<8.0.0",
    "librosa>=0.10.2,<0.11.0",
    "lightning>=2.2.0,<3.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "modelscope>=1.20.0,<2.0.0",
    "networkx>=3.1,<4.0",
    "omegaconf>=2.3.0,<3.0.0",
    "onnx>=1.16.0,<2.0.0",
    "onnxruntime-gpu>=1.18.0,<2.0.0; sys_platform == 'linux'",
    "onnxruntime>=1.18.0,<2.0.0; sys_platform == 'darwin' or sys_platform == 'win32'",
    "openai-whisper>=20231117",
    "protobuf>=4.25,<5.0",
    "pyarrow>=18.1.0,<19.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pyworld>=0.3.4,<0.4.0",
    "rich>=13.7.0,<14.0.0",
    "soundfile>=0.12.1,<0.13.0",
    "tensorboard>=2.14.0,<3.0.0",
    "torch>=2.3.0,<2.4.0",
    "torchaudio>=2.3.0,<2.4.0",
    "transformers>=4.51.0,<5.0.0",
    "uvicorn>=0.30.0,<0.31.0",
    "wetext>=0.0.4,<0.1.0",
    "wget>=3.2,<4.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "onnxruntime-cuda"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[project.optional-dependencies]
tensorrt = [
    "tensorrt-cu12>=10.0.0,<11.0.0; sys_platform == 'linux'",
    "tensorrt-cu12-bindings>=10.0.0,<11.0.0; sys_platform == 'linux'",
    "tensorrt-cu12-libs>=10.0.0,<11.0.0; sys_platform == 'linux'",
]
